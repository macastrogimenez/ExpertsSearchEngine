services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build:
      context: ./backend
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  embedding-processor:
    build:
      context: ./embeddingProcessor
    environment:
      OLLAMA_URL: http://ollama:11434
      # Milvus runs in the separate milvus/docker-compose.yml stack.
      MILVUS_URL: ${MILVUS_URL:-http://host.docker.internal:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:Milvus}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    depends_on:
      - ollama

volumes:
  ollama-data:
