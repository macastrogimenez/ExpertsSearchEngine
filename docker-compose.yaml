services:
  ollama:
    image: ollama/ollama:0.40.15
    ports:
      - "127.0.0.1:11435:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build:
      context: ./backend
    environment:
      OLLAMA_URL: http://ollama:11434
      BM25_INDEX_ROOT: /app/whoosh
    volumes:
      - backend-data:/app/whoosh
    ports:
      - "8000:8000"
    depends_on:
      - ollama
    dns:
      - 1.1.1.1
      - 8.8.8.8

  embedding-processor:
    build:
      context: ./embeddingProcessor
    environment:
      OLLAMA_URL: http://ollama:11434
      # Milvus runs in the separate milvus/docker-compose.yml stack.
      MILVUS_URL: ${MILVUS_URL:-http://host.docker.internal:19530}
      MILVUS_TOKEN: ${MILVUS_TOKEN:-root:Milvus}
      DB_HOST: ${DB_HOST:-}
      DB_NAME: ${DB_NAME:-}
      DB_USERNAME: ${DB_USERNAME:-}
      DB_PASSWORD: ${DB_PASSWORD:-}
    depends_on:
      - ollama
    ports:
      - "8080:8080"

volumes:
  ollama-data:
  backend-data:
