services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build:
      context: ./backend
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  embedding-processor:
    build:
      context: ./embeddingProcessor
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama

volumes:
  ollama-data: