services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  backend:
    build:
      context: ./backend
    environment:
      OLLAMA_URL: http://ollama:11434
    ports:
      - "8000:8000"
    depends_on:
      - ollama

  embedding-processor:
    build:
      context: ./embeddingProcessor
    environment:
      OLLAMA_URL: http://ollama:11434
    depends_on:
      - ollama
    
  faiss:
    build:
      context: ./faiss
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      - faiss-data:/data
    restart: unless-stopped

volumes:
  ollama-data:
  faiss-data: